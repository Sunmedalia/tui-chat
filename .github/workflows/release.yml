name: release

on:
  push:
    tags:
      - "v*"

jobs:
  build-client:
    name: Build ${{ matrix.archive }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tui-chat-linux-x86_64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tui-chat-macos-x86_64
          - os: macos-14
            target: aarch64-apple-darwin
            archive: tui-chat-macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: tui-chat-windows-x86_64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --release --locked --target ${{ matrix.target }} -p tui-chat
      - name: Package Unix client
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir dist
          cp "target/${{ matrix.target }}/release/tui-chat" dist/
          tar -C dist -czf "${{ matrix.archive }}.tar.gz" tui-chat
          shasum -a 256 "${{ matrix.archive }}.tar.gz" > "${{ matrix.archive }}.sha256"
      - name: Package Windows client
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist
          Copy-Item "target/${{ matrix.target }}/release/tui-chat.exe" dist/tui-chat.exe
          Compress-Archive dist/tui-chat.exe "${{ matrix.archive }}.zip"
          (Get-FileHash "${{ matrix.archive }}.zip" -Algorithm SHA256).Hash.ToLower() + "  ${{ matrix.archive }}.zip" | Out-File "${{ matrix.archive }}.sha256"
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ matrix.archive }}.*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.archive }}
          path: |
            ${{ matrix.archive }}.*

  publish:
    name: Publish GitHub Release
    needs: build-client
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.95.0
      - name: Generate CycloneDX SBOM
        shell: bash
        run: |
          set -euo pipefail
          cargo install cargo-cyclonedx --version 0.5.9 --locked
          cargo cyclonedx --format json --all
          mkdir -p sbom
          find . -name '*.cdx.json' -not -path './target/*' -exec cp {} sbom/ \;
          compgen -G 'sbom/*.cdx.json' > /dev/null
          tar -C sbom -czf tui-chat-sbom.cyclonedx-json.tar.gz .
          sha256sum tui-chat-sbom.cyclonedx-json.tar.gz > tui-chat-sbom.cyclonedx-json.sha256
      - name: Attest SBOM provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: tui-chat-sbom.cyclonedx-json.*
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: tui-chat-*
          path: dist
          merge-multiple: true
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/* \
            tui-chat-sbom.cyclonedx-json.*
